  bank: {name: Commercial Bank, aliases: [bank, banks, commercial bank, commercial banks, scheduled commercial bank]}
  cooperative-bank: {name: Co-operative Bank, aliases: [ucb, ucbs, urban co-operative bank, co-operative bank, cooperative bank, rcb]}
  lsp: {name: Lending Service Provider, aliases: [lsp, lsps, lending service provider, lending service providers]}
  dla: {name: Digital Lending App, aliases: [dla, dlas, digital lending app, digital lending apps]}
  service-provider: {name: Outsourced service provider, aliases: [service provider, service providers, third-party service provider]}
  recovery-agent: {name: Recovery Agent, aliases: [recovery agent, recovery agents]}
  credit-information-company: {name: Credit Information Company, aliases: [credit information company, credit information companies, credit bureau]}
  originator: {name: Originator (securitisation or credit transfer), aliases: [originator, originators, transferor]}
  spe: {name: Special Purpose Entity, aliases: [spe, spes, special purpose entity]}
  borrower: {name: Borrower / Customer, aliases: [borrower, borrowers, customer, customers]}
  guarantor: {name: Guarantor, aliases: [guarantor, guarantors]}

