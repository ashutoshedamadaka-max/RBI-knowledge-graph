# Canonical entities for the knowledge graph (Phase 4). The LLM must pick one of these ids;
# a name it gives that matches an alias resolves to that id, anything else is counted as unresolved.
# Aliases are compared lower-case with punctuation removed.

RegulatedEntity:
  nbfc: {name: NBFC (all layers), aliases: [nbfc, nbfcs, non-banking financial company, non-banking financial companies, applicable nbfcs]}
  nbfc-bl: {name: NBFC - Base Layer, aliases: [nbfc-bl, base layer nbfc, nbfcs in the base layer, base layer]}
  nbfc-ml: {name: NBFC - Middle Layer, aliases: [nbfc-ml, middle layer nbfc, nbfcs in the middle layer, middle layer]}
  nbfc-ul: {name: NBFC - Upper Layer, aliases: [nbfc-ul, upper layer nbfc, nbfcs in the upper layer, upper layer]}
  nbfc-tl: {name: NBFC - Top Layer, aliases: [nbfc-tl, top layer nbfc, top layer]}
  nbfc-mfi: {name: NBFC - Microfinance Institution, aliases: [nbfc-mfi, nbfc-mfis, microfinance institution, mfi]}
  nbfc-p2p: {name: NBFC - Peer to Peer Lending Platform, aliases: [nbfc-p2p, p2p platform, peer to peer lending platform]}
  hfc: {name: Housing Finance Company, aliases: [hfc, hfcs, housing finance company, housing finance companies]}
  cic: {name: Core Investment Company, aliases: [cic, cics, core investment company]}
  nbfc-factor: {name: NBFC - Factor, aliases: [nbfc-factor, factor, nbfc factors]}
