# Written corpus inclusion rule (ADR-013). Changing scope means editing this file, not
# hand-picking documents. Every inclusion and exclusion is logged with its reason.

master_directions:
  # Regulated entities whose consolidated directions are in scope. Add "Commercial Banks"
  # here to extend the corpus to banks.
  entities:
    - Non-Banking Financial Companies
  # A direction is included when its title names one of these lending topics.
  topics:
    - Credit Facilities
    - Responsible Business Conduct      # fair practices, penal charges, borrower disclosures
    - Know Your Customer                # borrower onboarding
    - Income Recognition, Asset Classification and Provisioning
    - Resolution of Stressed Assets
    - Wilful Defaulters
    - Credit Information Reporting
    - Transfer and Distribution of Credit Risk   # transfer of loan exposures
    - Securitisation
    - Credit Risk Management
    - Concentration Risk Management     # exposure limits on lending
    - Scale Based Regulation
    - Microfinance
    - Peer to Peer Lending
    - Credit Cards
    - Managing Risks in Outsourcing     # includes recovery agents

# Withdrawn circulars from RBI's register (app/monitoring/withdrawn_register.py), kept as the
# history of the rules above: the predecessors that successor links and the replay need.
withdrawn_circulars:
  issued_since: 2021-10-21          # about five years before the corpus was built
  include_title_keywords: [loan, lend, credit, borrow, NBFC, Non-Banking, KYC, Know Your Customer, penal,
                           "interest rate on advances", advances, co-lend, securiti, wilful, stressed,
                           fair practice, recovery, microfinance, gold, provisioning, asset classification,
                           income recognition, scale based, key facts, defaulter, EMI]
  exclude_title_keywords: [deposit, Interest Equalization, Basel, ECAI, Credit Rating, share capital,
                           Branch Authorisation, derivative, Gold Monetization, Interest Rate Risk in Banking Book,
                           Compliance Function, Core Financial Services, Prompt Corrective Action, Fraud Risk,
                           Account Aggregator, Penal Interest on Shortfall in CRR, Bank Finance to Non-Banking,
                           Exposures of Scheduled Commercial Banks, Risk Weights, Security Receipts,
                           Declaration of Dividends, Housing Loan Limits, Individual Housing Loans]
